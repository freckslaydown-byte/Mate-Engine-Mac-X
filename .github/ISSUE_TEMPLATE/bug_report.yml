name: Report Bug
description: Report something that's broken or not working right.
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Summary
      description: One line — what's wrong.
      placeholder: "It crashed when I clicked X..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we replicate the bug?
      placeholder: "Step-by-step instructions to trigger the issue"
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs Actual
      description: What should happen, and what happens instead?
      value: |
        **Expected**
        <!-- what should happen -->

        **Actual**
        <!-- what happens instead -->
    validations:
      required: true

  - type: dropdown
    id: macos-version
    attributes:
      label: macOS Version
      description: "Which macOS release were you on? (Supported: macOS 26 Tahoe and newer.)"
      options:
        - macOS 26 (Tahoe)
        - macOS 15 (Sequoia)
        - Older
        - Other
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version / Build
      description: Tag, branch, or build info if known (e.g. v1.0.0, or a commit SHA).
      placeholder: "v1.0.0"
    validations:
      required: false

  - type: dropdown
    id: classification
    attributes:
      label: Classification Guess (optional)
      description: Your best guess helps triage. The maintainer applies the final label.
      options:
        - bug
        - hotfix
        - enhancement
        - localization
        - macos-version
        - docs
        - Not sure
    validations:
      required: false

  - type: input
    id: localization-impact
    attributes:
      label: Localization Impact (optional)
      description: Which locales are affected, if any? Localization is a ship blocker here.
      placeholder: "None / e.g. JA, ZH-CN, DE"
    validations:
      required: false

  - type: checkboxes
    id: read_note
    attributes:
      label: Confirmation
      description: Confirm you've read the guideline above.
      options:
        - label: I confirm this report includes **only one** bug.
    validations:
      required: true